<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foto del producto | JS Trendy Shop</title>
<meta name="robots" content="noindex">
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f7f4ef;color:#171717}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
.card{max-width:520px;width:100%;background:#fff;border:1px solid #e5e0d8;border-radius:22px;padding:20px;box-sizing:border-box;box-shadow:0 12px 35px rgba(0,0,0,.08)}
img{display:block;max-width:100%;max-height:78vh;width:auto;height:auto;margin:0 auto;border-radius:14px}
.loading{padding:50px 10px;color:#666}.error{padding:30px 10px;color:#555}.error b{display:block;color:#171717;margin-bottom:8px}
</style>
</head>
<body>
<main><div class="card" id="app"><div class="loading">Cargando foto del producto…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fafryvpzvewbwjgznzsg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_l4iQHwmQpCOPnoe7JBcK4w_soduEaIy";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const app=document.getElementById("app");
(async()=>{
  const id=new URLSearchParams(location.search).get("id");
  if(!id){app.innerHTML='<div class="error"><b>Producto no encontrado</b>El enlace no contiene un producto válido.</div>';return;}
  const {data,error}=await supabaseClient.from("productos").select("nombre,imagen").eq("id",id).maybeSingle();
  if(error||!data?.imagen){app.innerHTML='<div class="error"><b>Foto no disponible</b>La imagen de este producto no está disponible actualmente.</div>';return;}
  document.title=(data.nombre||"Producto")+" | JS Trendy Shop";
  app.innerHTML='<img src="'+String(data.imagen).replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'" alt="Foto del producto">';
})();
</script>
</body>
</html>
